<body><script>
(function(){

  addEventListener('error',function(e){show('Ошибка: '+(e.message||e.target&&e.target.src||e))});
  addEventListener('unhandledrejection',function(e){show('Ошибка (promise): '+(e.reason&&e.reason.stack||e.reason))});
  setTimeout(function(){if(!window.__rvLoaded)show('Игра не загрузилась.\n- Если открыли index.html двойным кликом (file://) — так не работает, нужен сервер: npm run dev или npm run preview.\n- Если это GitHub Pages — публиковать нужно папку dist (npm run build), а не исходники.\n- Откройте консоль браузера (F12) и пришлите первую красную ошибку.')},4000);
})();
</script><div id="ui"></div><script type="module" src="/src/main.js"></script></body></html>
